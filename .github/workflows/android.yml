name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-video-60fps-4k-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
