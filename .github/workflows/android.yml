name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build and test
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hyouka-video-60fps-4k-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
